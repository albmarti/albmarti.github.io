<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Grupo de figuras humanas estilizadas -->
    <g stroke="#b85f44" stroke-width="2" fill="none">
        <!-- Figura central -->
        <path d="M12 7.5 L12 10.5" stroke-linecap="round"/> <!-- Cuello -->
        <circle cx="12" cy="6" r="1.5"/> <!-- Cabeza -->
        <path d="M9 15 L12 10.5 L15 15" stroke-linecap="round"/> <!-- Cuerpo en forma de V -->
        
        <!-- Figura izquierda -->
        <path d="M8 9 L8 12" stroke-linecap="round"/> <!-- Cuello -->
        <circle cx="8" cy="7.5" r="1.5"/> <!-- Cabeza -->
        <path d="M5 16.5 L8 12 L11 16.5" stroke-linecap="round"/> <!-- Cuerpo en forma de V -->
        
        <!-- Figura derecha -->
        <path d="M16 9 L16 12" stroke-linecap="round"/> <!-- Cuello -->
        <circle cx="16" cy="7.5" r="1.5"/> <!-- Cabeza -->
        <path d="M13 16.5 L16 12 L19 16.5" stroke-linecap="round"/> <!-- Cuerpo en forma de V -->
        
        <!-- Base conectora -->
        <path d="M5 16.5 C5 16.5 12 18.5 19 16.5" stroke-linecap="round"/> <!-- Línea curva que une las figuras -->
    </g>
</svg>
