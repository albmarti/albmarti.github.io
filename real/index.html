<body>

<!-- Resto del contenido HTML existente -->

<section id="reviews" class="reviews-section">
    <h2>Opiniones de Pacientes</h2>
    <div class="reviews-summary">
        <div class="average-rating">
            <div class="rating-number">0.0</div>
            <div class="stars-display"></div>
            <div class="total-reviews">0 opiniones</div>
        </div>
    </div>
    
    <div class="reviews-container">
        <!-- Las reseñas se cargarán aquí dinámicamente -->
    </div>

    <button class="add-review-btn" onclick="showReviewForm()">Añadir una opinión</button>

    <div id="reviewFormModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeReviewForm()">&times;</button>
            <h3>Comparte tu experiencia</h3>
            <form id="reviewForm" class="review-form" onsubmit="submitReview(event)">
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="rating-input">
                    <label>Tu valoración:</label>
                    <div class="stars-input">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1">★</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="review">Tu opinión:</label>
                    <textarea id="review" name="review" required
                             placeholder="Comparte tu experiencia (mínimo 20 caracteres)"
                             minlength="20"></textarea>
                </div>
                
                <button type="submit" class="submit-review">Enviar opinión</button>
            </form>
        </div>
    </div>
</section>

<script>
// Sistema de reseñas
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxa1LDH2R7FopqB5zLJc9SJ8dBlDUCA20MA1cKLgg_WNQORJKOtAHJ3SbeEzhIFoDQz/exec';

async function loadReviews() {
    try {
        const response = await fetch(GOOGLE_SHEET_URL + '?action=getReviews');
        const data = await response.json();
        
        if (data.reviews) {
            updateReviewsDisplay(data.reviews);
            updateAverageRating(data.reviews);
        }
    } catch (error) {
        console.error('Error loading reviews:', error);
    }
}

function updateReviewsDisplay(reviews) {
    const container = document.querySelector('.reviews-container');
    container.innerHTML = reviews.map(review => `
        <div class="review-card">
            <div class="review-header">
                <span class="review-author">${review.name}</span>
                <span class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</span>
            </div>
            <div class="review-content">${review.review}</div>
            <div class="review-date">${new Date(review.timestamp).toLocaleDateString()}</div>
        </div>
    `).join('');
}

function updateAverageRating(reviews) {
    const totalRatings = reviews.reduce((acc, rev) => acc + parseInt(rev.rating), 0);
    const averageRating = (totalRatings / reviews.length) || 0;
    const totalReviews = reviews.length;
    
    document.querySelector('.rating-number').textContent = averageRating.toFixed(1);
    document.querySelector('.stars-display').innerHTML = getStarDisplay(averageRating);
    document.querySelector('.total-reviews').textContent = `${totalReviews} opinione${totalReviews === 1 ? '' : 's'}`;
}

function getStarDisplay(rating) {
    const fullStars = Math.floor(rating);
    const decimal = rating - fullStars;
    let stars = '★'.repeat(fullStars);
    
    if (decimal > 0) {
        stars += decimal >= 0.5 ? '★' : '☆';
    }
    
    stars += '☆'.repeat(5 - Math.ceil(rating));
    return stars;
}

function showReviewForm() {
    document.getElementById('reviewFormModal').style.display = 'block';
}

function closeReviewForm() {
    document.getElementById('reviewFormModal').style.display = 'none';
    document.getElementById('reviewForm').reset();
}

async function submitReview(event) {
    event.preventDefault();
    
    const form = event.target;
    const formData = new FormData(form);
    
    try {
        const response = await fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'addReview',
                name: formData.get('name'),
                rating: formData.get('rating'),
                review: formData.get('review'),
                timestamp: new Date().toISOString()
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            closeReviewForm();
            loadReviews();
            alert('¡Gracias por compartir tu opinión!');
        } else {
            alert('Error al enviar la reseña. Por favor, inténtalo de nuevo.');
        }
    } catch (error) {
        console.error('Error submitting review:', error);
        alert('Error al enviar la reseña. Por favor, inténtalo de nuevo.');
    }
}

// Cerrar modal al hacer clic fuera
window.onclick = function(event) {
    const modal = document.getElementById('reviewFormModal');
    if (event.target === modal) {
        closeReviewForm();
    }
}

// Cargar reseñas al iniciar la página
document.addEventListener('DOMContentLoaded', loadReviews);
</script>

</body>
</html>
